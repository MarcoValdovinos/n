<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>QUANTUM SOUND</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#050508;color:#fff;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:430px;min-height:100vh;background:#0a0a12;position:relative;padding:18px 16px 110px;overflow:hidden}
header{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0 16px}
.logo{width:38px;height:38px;border:1.5px solid #7ef3ff;border-radius:10px;display:grid;place-items:center;font-size:20px;transform:rotate(45deg)}
.logo span{transform:rotate(-45deg)}
h1{font-size:26px;letter-spacing:.5px;font-weight:800;background:linear-gradient(90deg,#a8f5ff,#e9a8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search{width:100%;background:#14141f;border:1px solid #2a2a3d;border-radius:999px;padding:12px 16px;color:#fff;display:flex;gap:8px;align-items:center}
.search input{flex:1;background:transparent;border:0;outline:none;color:#fff;font-size:14px}
.search input::placeholder{color:#8a8a9e}
.row{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}
.row h2{font-size:18px}
.row a{color:#7ef3ff;text-decoration:none;font-size:13px}
.playlists{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#15151f;border-radius:18px;overflow:hidden;cursor:pointer;border:1px solid #222233}
.card .art{height:120px;display:grid;place-items:center;font-size:36px;position:relative;overflow:hidden}
.art1{background:radial-gradient(circle at 30% 30%,#00e5ff33,transparent),linear-gradient(135deg,#0ff,#f0f)}
.art2{background:radial-gradient(circle at 70% 30%,#ff4df033,transparent),linear-gradient(135deg,#a855f7,#ec4899)}
.wave{position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 8px,rgba(255,255,255,.18) 9px,transparent 10px);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card p{padding:10px 10px 2px;font-weight:800;font-size:13px;text-align:center}
.card small{display:block;text-align:center;color:#9a9ab0;font-size:11px;padding-bottom:10px}
h2.sec{margin:22px 0 12px;font-size:18px}
.song{display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:14px;cursor:pointer}
.song.active{background:#1a1a2b}
.cover{width:52px;height:52px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-size:20px}
.c1{background:linear-gradient(135deg,#a5f3fc,#f0abfc)} .c2{background:linear-gradient(135deg,#f0abfc,#fda4af)} .c3{background:linear-gradient(135deg,#c4b5fd,#67e8f9)} .c4{background:linear-gradient(135deg,#67e8f9,#f0abfc)}
.song b{font-size:15px} .song span{color:#9a9ab0;font-size:12px}
.playbtn{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1.5px solid #7ef3ff;background:transparent;color:#7ef3ff;font-size:14px;cursor:pointer}
.playbtn.pink{border-color:#ff7ad9;color:#ff7ad9}
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:68px;width:calc(100% - 32px);max-width:398px;background:#14141f;border:1px solid #2e2e44;border-radius:18px;padding:10px 12px}
.progress{height:4px;background:#2a2a3d;border-radius:999px;overflow:hidden;margin-bottom:10px}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#67e8f9,#f472b6)}
.p-row{display:flex;align-items:center;gap:10px}
.p-cover{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#67e8f9,#f0abfc);display:grid;place-items:center}
.p-info{flex:1;min-width:0} .p-info b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block} .p-info span{font-size:11px;color:#9a9ab0}
.ctrl{width:32px;height:32px;border-radius:50%;border:1px solid #444;background:transparent;color:#fff;cursor:pointer}
.ctrl.main{width:38px;height:38px;border-color:#ff7ad9;color:#ff7ad9;font-size:16px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:#0e0e17;border-top:1px solid #222233;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0 14px}
nav button{background:none;border:0;color:#8a8a9e;font-size:11px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}
nav button.on{color:#7ef3ff} nav button i{font-size:18px;font-style:normal}
</style>
</head>
<body>
<div class="app">
<header><div class="logo"><span>◆</span></div><h1>QUANTUM SOUND</h1></header>
<label class="search">🔍 <input id="buscador" placeholder="Buscar canciones, artistas o playlists"></label>
<div class="row"><h2>Playlists</h2><a href="#" onclick="return false">Ver todo</a></div>
<div class="playlists">
<div class="card" onclick="filtrar('cymatic')"><div class="art art1"><div class="wave"></div>〰️</div><p>CYMATIC WAVES</p><small>24 temas • Ambient • Chill</small></div>
<div class="card" onclick="filtrar('neon')"><div class="art art2"><div class="wave"></div>🌌</div><p>NEON NEBULA</p><small>18 temas • Synthwave • Focus</small></div>
</div>
<h2 class="sec">Para ti — Hoy</h2>
<div id="lista"></div>
</div>
<div class="player">
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="p-row">
<div class="p-cover" id="pCover">🎵</div>
<div class="p-info"><b id="pTitle">Echo Chamber</b><span id="pArtist">Nova Rift • 1:24 de 3:42</span></div>
<button class="ctrl" onclick="anterior()">⏮</button>
<button class="ctrl main" id="btnPlay" onclick="togglePlay()">⏸</button>
<button class="ctrl" onclick="siguiente()">⏭</button>
</div>
</div>
<nav>
<button class="on"><i>🏠</i>Inicio</button>
<button onclick="document.getElementById('buscador').focus()"><i>🔍</i>Buscar</button>
<button><i>📚</i>Biblioteca</button>
<button><i>👤</i>Perfil</button>
</nav>
<script>
const canciones=[
{id:0,titulo:"Nebula Drift",artista:"Aurora Flux",dur:"2:45",emoji:"🌊",clase:"c1",freq:432,tag:"cymatic"},
{id:1,titulo:"Pulse Zero",artista:"Vanta",dur:"3:12",emoji:"💗",clase:"c2",freq:528,tag:"neon"},
{id:2,titulo:"Synthetic Bloom",artista:"Lysr",dur:"4:01",emoji:"🌸",clase:"c3",freq:639,tag:"cymatic"},
{id:3,titulo:"Echo Chamber",artista:"Nova Rift",dur:"3:42",emoji:"🌀",clase:"c4",freq:741,tag:"neon"},
];
let actual=3, sonando=true, ctx=null, osc=null, gain=null, prog=36;
const lista=document.getElementById('lista');
function pintar(filtro=""){
  lista.innerHTML="";
  canciones.filter(c=>c.titulo.toLowerCase().includes(filtro)||c.artista.toLowerCase().includes(filtro)||c.tag.includes(filtro)).forEach(c=>{
    const d=document.createElement('div');
    d.className='song'+(c.id===actual?' active':'');
    d.innerHTML=`<div class="cover ${c.clase}">${c.emoji}</div><div><b>${c.titulo}</b><br><span>${c.artista} • ${c.dur}</span></div><button class="playbtn ${c.id%2?'pink':''}" onclick="tocar(${c.id},event)">▶</button>`;
    d.onclick=()=>tocar(c.id);
    lista.appendChild(d);
  });
}
function iniciarAudio(f){
  if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
  pararAudio();
  osc=ctx.createOscillator(); gain=ctx.createGain();
  osc.type='sine'; osc.frequency.value=f;
  gain.gain.value=0.08;
  const lfo=ctx.createOscillator(); const lfoGain=ctx.createGain();
  lfo.frequency.value=0.5; lfoGain.gain.value=30;
  lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); lfo.start();
}
function pararAudio(){ try{osc&&osc.stop()}catch(e){} osc=null; }
function tocar(id,e){
  if(e) e.stopPropagation();
  actual=id; const c=canciones[id];
  document.getElementById('pTitle').textContent=c.titulo;
  document.getElementById('pArtist').textContent=c.artista+' • 0:00 de '+c.dur;
  document.getElementById('pCover').textContent=c.emoji;
  sonando=true; document.getElementById('btnPlay').textContent='⏸';
  iniciarAudio(c.freq); prog=0; pintar(document.getElementById('buscador').value.toLowerCase());
}
function togglePlay(){
  sonando=!sonando;
  document.getElementById('btnPlay').textContent=sonando?'⏸':'▶';
  if(sonando) iniciarAudio(canciones[actual].freq); else pararAudio();
}
function siguiente(){ tocar((actual+1)%canciones.length); }
function anterior(){ tocar((actual-1+canciones.length)%canciones.length); }
function filtrar(tag){ document.getElementById('buscador').value=tag; pintar(tag); }
document.getElementById('buscador').addEventListener('input',e=>pintar(e.target.value.toLowerCase()));
setInterval(()=>{
  if(!sonando) return;
  prog=(prog+0.3)%100;
  document.getElementById('bar').style.width=prog+'%';
},300);
pintar();
iniciarAudio(741);
</script>
</body>
</html>
