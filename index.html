<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>QUANTUM SOUND - Mi Música</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#050508;color:#fff;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:430px;min-height:100vh;background:#0a0a12;padding:18px 16px 120px}
header{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0 12px}
.logo{width:38px;height:38px;border:1.5px solid #7ef3ff;border-radius:10px;display:grid;place-items:center;font-size:20px;transform:rotate(45deg)}
.logo span{transform:rotate(-45deg)}
h1{font-size:24px;font-weight:800;background:linear-gradient(90deg,#a8f5ff,#e9a8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn-mio{width:100%;background:linear-gradient(90deg,#06b6d4,#ec4899);border:0;color:#fff;padding:14px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;margin:10px 0}
.btn-mio small{display:block;font-weight:400;font-size:11px;opacity:.9;margin-top:2px}
.search{width:100%;background:#14141f;border:1px solid #2a2a3d;border-radius:999px;padding:12px 16px;color:#fff;display:flex;gap:8px;align-items:center}
.search input{flex:1;background:transparent;border:0;outline:none;color:#fff;font-size:14px}
.search input::placeholder{color:#8a8a9e}
.row{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.row h2{font-size:18px}
.playlists{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#15151f;border-radius:18px;overflow:hidden;cursor:pointer;border:1px solid #222233}
.card .art{height:110px;display:grid;place-items:center;font-size:32px;position:relative;overflow:hidden}
.art1{background:linear-gradient(135deg,#0ff,#f0f)} .art2{background:linear-gradient(135deg,#a855f7,#ec4899)}
.wave{position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 8px,rgba(255,255,255,.18) 9px,transparent 10px);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card p{padding:10px 10px 2px;font-weight:800;font-size:13px;text-align:center}
.card small{display:block;text-align:center;color:#9a9ab0;font-size:11px;padding-bottom:10px}
h2.sec{margin:20px 0 10px;font-size:18px}
.count{color:#7ef3ff;font-size:12px;margin-bottom:8px}
.song{display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:14px;cursor:pointer}
.song.active{background:#1a1a2b}
.cover{width:52px;height:52px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-size:20px}
.c1{background:linear-gradient(135deg,#a5f3fc,#f0abfc)} .c2{background:linear-gradient(135deg,#f0abfc,#fda4af)} .c3{background:linear-gradient(135deg,#c4b5fd,#67e8f9)} .c4{background:linear-gradient(135deg,#67e8f9,#f0abfc)} .cmio{background:linear-gradient(135deg,#22d3ee,#f472b6)}
.song b{font-size:14px} .song span{color:#9a9ab0;font-size:12px}
.playbtn{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1.5px solid #7ef3ff;background:transparent;color:#7ef3ff;font-size:14px;cursor:pointer}
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:68px;width:calc(100% - 32px);max-width:398px;background:#14141f;border:1px solid #2e2e44;border-radius:18px;padding:10px 12px}
.progress{height:4px;background:#2a2a3d;border-radius:999px;overflow:hidden;margin-bottom:10px}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#67e8f9,#f472b6)}
.p-row{display:flex;align-items:center;gap:10px}
.p-cover{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#67e8f9,#f0abfc);display:grid;place-items:center}
.p-info{flex:1;min-width:0} .p-info b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block} .p-info span{font-size:11px;color:#9a9ab0}
.ctrl{width:32px;height:32px;border-radius:50%;border:1px solid #444;background:transparent;color:#fff;cursor:pointer}
.ctrl.main{width:38px;height:38px;border-color:#ff7ad9;color:#ff7ad9;font-size:16px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:#0e0e17;border-top:1px solid #222233;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0 14px}
nav button{background:none;border:0;color:#8a8a9e;font-size:11px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}
nav button.on{color:#7ef3ff} nav button i{font-size:18px;font-style:normal}
</style>
</head>
<body>
<div class="app">
<header><div class="logo"><span>◆</span></div><h1>QUANTUM SOUND</h1></header>
<button class="btn-mio" onclick="document.getElementById('fileInput').click()">📂 CARGAR MI MÚSICA DEL CELULAR<small>Toca aquí y elige tus MP3 de Music / Download</small></button>
<input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.wav,.ogg" multiple hidden>
<label class="search">🔍 <input id="buscador" placeholder="Buscar en mi música..."></label>
<div class="row"><h2>Playlists</h2><a href="#" onclick="return false">Ver todo</a></div>
<div class="playlists">
<div class="card" onclick="filtrar('cymatic')"><div class="art art1"><div class="wave"></div>〰️</div><p>CYMATIC WAVES</p><small>Tu vibra • Ambient</small></div>
<div class="card" onclick="filtrar('neon')"><div class="art art2"><div class="wave"></div>🌌</div><p>NEON NEBULA</p><small>Tu vibra • Synthwave</small></div>
</div>
<h2 class="sec">Mi música del celular</h2>
<div class="count" id="count">Aún no has cargado música - toca el botón de arriba</div>
<div id="lista"></div>
</div>
<div class="player">
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="p-row">
<div class="p-cover" id="pCover">🎵</div>
<div class="p-info"><b id="pTitle">Elige una canción de tu celular</b><span id="pArtist">Quantum Sound • Tu música</span></div>
<button class="ctrl" onclick="anterior()">⏮</button>
<button class="ctrl main" id="btnPlay" onclick="togglePlay()">▶</button>
<button class="ctrl" onclick="siguiente()">⏭</button>
</div>
</div>
<nav>
<button class="on"><i>🏠</i>Inicio</button>
<button onclick="document.getElementById('buscador').focus()"><i>🔍</i>Buscar</button>
<button><i>📚</i>Biblioteca</button>
<button><i>👤</i>Perfil</button>
</nav>
<audio id="audio" preload="metadata"></audio>
<script>
let canciones=[];
let actual=0, sonando=false, ctx=null, osc=null;
const lista=document.getElementById('lista'), audio=document.getElementById('audio');
const count=document.getElementById('count');
document.getElementById('fileInput').addEventListener('change',e=>{
  const files=[...e.target.files];
  files.forEach(f=>{
    const nombre=f.name.replace(/\.(mp3|m4a|wav|ogg|flac)$/i,'');
    canciones.push({titulo:nombre,artista:'Mi celular • '+f.name.split('.').pop().toUpperCase(),emoji:'🎵',clase:'cmio',fileURL:URL.createObjectURL(f),tag:'mio'});
  });
  count.textContent=canciones.length+' canciones de tu celular listas';
  pintar('');
  if(canciones.length) tocar(0);
});
function pintar(filtro=""){
  lista.innerHTML="";
  const filtradas=canciones.filter(c=>c.titulo.toLowerCase().includes(filtro)||c.artista.toLowerCase().includes(filtro));
  if(!filtradas.length && canciones.length===0){
    lista.innerHTML='<p style="color:#8a8a9e;font-size:13px;padding:10px">No hay canciones todavía.<br>Toca <b style="color:#fff">CARGAR MI MÚSICA</b> y elige tus MP3.</p>'; return;
  }
  filtradas.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='song'+(canciones.indexOf(c)===actual?' active':'');
    d.innerHTML=`<div class="cover ${c.clase}">${c.emoji}</div><div style="min-width:0"><b>${c.titulo}</b><br><span>${c.artista}</span></div><button class="playbtn" onclick="tocar(${canciones.indexOf(c)},event)">▶</button>`;
    d.onclick=()=>tocar(canciones.indexOf(c));
    lista.appendChild(d);
  });
}
function pararOsc(){ try{osc&&osc.stop()}catch(e){} osc=null; }
function tocar(id,e){
  if(e) e.stopPropagation();
  actual=id; const c=canciones[id]; if(!c) return;
  document.getElementById('pTitle').textContent=c.titulo;
  document.getElementById('pArtist').textContent=c.artista;
  document.getElementById('pCover').textContent=c.emoji;
  sonando=true; document.getElementById('btnPlay').textContent='⏸';
  pararOsc(); audio.pause();
  if(c.fileURL){ audio.src=c.fileURL; audio.play(); }
  pintar(document.getElementById('buscador').value.toLowerCase());
}
function togglePlay(){
  if(!canciones.length) { document.getElementById('fileInput').click(); return; }
  sonando=!sonando;
  document.getElementById('btnPlay').textContent=sonando?'⏸':'▶';
  if(sonando) audio.play(); else audio.pause();
}
function siguiente(){ if(canciones.length) tocar((actual+1)%canciones.length); }
function anterior(){ if(canciones.length) tocar((actual-1+canciones.length)%canciones.length); }
function filtrar(tag){ document.getElementById('buscador').value=''; pintar(''); }
document.getElementById('buscador').addEventListener('input',e=>pintar(e.target.value.toLowerCase()));
audio.addEventListener('timeupdate',()=>{
  if(audio.duration) document.getElementById('bar').style.width=(audio.currentTime/audio.duration*100)+'%';
});
audio.addEventListener('ended',()=>siguiente());
pintar();
</script>
</body>
</html>
